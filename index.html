  <style>
    /* Textura sutil de papel artesanal */
    body {
      background-color: #FDFBF7;
      background-image: radial-gradient(rgba(197, 160, 89, 0.08) 1px, transparent 0);
      background-size: 28px 28px;
      color: #2D2A26;
      overflow-x: hidden;
    }

    /* Marco ornamental doble dorado */
    .ornate-frame {
      position: relative;
      border: 1px solid rgba(197, 160, 89, 0.45);
      box-shadow: 0 20px 50px -15px rgba(44, 76, 59, 0.08);
    }
    .ornate-frame::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(197, 160, 89, 0.25);
      pointer-events: none;
      border-radius: inherit;
    }

    /* Marco tipo arco botánico */
    .arch-frame {
      border-radius: 220px 220px 24px 24px;
      border: 1.5px solid #C5A059;
      padding: 10px;
      background: linear-gradient(180deg, rgba(250, 218, 221, 0.3) 0%, rgba(253, 251, 247, 0.9) 100%);
    }

    /* Pétalos flotantes animados */
    @keyframes floatPetal {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.6; }
      100% { transform: translateY(105vh) translateX(45px) rotate(360deg); opacity: 0; }
    }
    .petal {
      position: fixed;
      top: -5%;
      pointer-events: none;
      z-index: 5;
      animation: floatPetal linear infinite;
    }

    /* Efecto de brillo suave en tarjetas */
    .floral-card {
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
